name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-flight deploy finish rather
# than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build for Pages
    runs-on: ubicloud-standard-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: images-${{ hashFiles('src/images/**/*') }}
          restore-keys: |
            images-

      # Resolves where Pages will serve this site: a project site gets a
      # /repo-name base path, a custom domain or user site gets none. The
      # outputs feed PATH_PREFIX (URL rewriting) and SITE_URL (canonical
      # URLs, sitemap, feeds), so the same workflow works for both without
      # edits. Requires Pages to be enabled with "GitHub Actions" as the
      # source under Settings → Pages.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Site
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      # Repository docs (the generated Site Builder Reference) publish
      # alongside the site at /docs/.
      - name: Merge docs into site output
        run: cp -r docs _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubicloud-standard-4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
